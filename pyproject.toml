[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wfp-worker"
version = "0.1.0"
description = "Wise Fine-tuning Pipeline — ML Worker"
requires-python = ">=3.12"
dependencies = [
    # 시스템 정보 수집
    "psutil>=5.9",
    "py-cpuinfo>=9.0",
    # NVIDIA GPU (옵션 — NVIDIA 환경에서만 활성)
    "pynvml>=11.5; sys_platform != 'darwin'",
    # API / 서버
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    # 데이터 처리
    "datasets>=2.19",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    # 텍스트 정제
    "ftfy>=6.2",
    # Stage 5 — 웹 수집 (collector._collect_web)
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    # ML 핵심 (optional — 실제 학습 환경에서만)
    # "torch>=2.2"
    # "transformers>=4.45"
    # "peft>=0.10"
    # "trl>=0.8"
    # "bitsandbytes>=0.43"
    # "accelerate>=0.29"
    # "evaluate>=0.4"
    # 패키징
    "huggingface-hub>=0.22",
    "safetensors>=0.4",
    # 환경 변수
    "python-dotenv>=1.0",
    # 인증 / DB
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "passlib[argon2]>=1.7",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "email-validator>=2.2",
]

[project.optional-dependencies]
train = [
    # CPU/MPS 호환 기본 학습 스택 (bitsandbytes 제외)
    "torch>=2.2",
    "transformers>=4.45",
    "peft>=0.10",
    "trl>=0.8",
    "accelerate>=0.29",
    "evaluate>=0.4",
    "rouge-score>=0.1.2",
    "nltk>=3.8",
    "tensorboardX>=2.6",
]
train_gpu = [
    # CUDA 환경 전용 — Dockerfile.gpu에서만 사용
    "wfp-worker[train]",
    "bitsandbytes>=0.43",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wfp_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
